
<!DOCTYPE html>

    <style>
        body {

        }

        section {
            max-width: 600px;
            margin: 30px auto;
            padding: 30px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 4px 10px #e8b6cc;
            text-align: center;
        }

        input, textarea {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #d98bb8;
            border-radius: 8px;
            font-family: Arial, sans-serif;

        button {
